# Static website only (no ERPNext, no Caddy).
# Host nginx terminates TLS and proxies to 127.0.0.1:8088.
#
#   docker compose -f docker-compose.website-only.yml up -d
#   ./manage.sh deploy-static

include:
  - docker-compose.base.yml

services:
  website:
    image: nginx:alpine
    restart: unless-stopped
    container_name: jsrspaces_website
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jsrspaces_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
