# JSRSpaces static site on masteryhub-website-machine.
# Upstream: docker compose -f docker-compose.website-only.yml → 127.0.0.1:8088
#
# Install (from repo checkout on the VPS):
#   sudo cp deploy/nginx/jsrspaces.conf /etc/nginx/sites-available/jsrspaces
#   sudo ln -sf /etc/nginx/sites-available/jsrspaces /etc/nginx/sites-enabled/jsrspaces
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.jsrspaces.com -d jsrspaces.com
#
# DNS: A for jsrspaces.com and www.jsrspaces.com → this server IP.
# Leave erp.jsrspaces.com pointing at the ERP host.

upstream jsrspaces_static {
    server 127.0.0.1:8088;
    keepalive 8;
}

# HTTP bootstrap (certbot --nginx adds TLS listeners and certificates).
server {
    listen 80;
    listen [::]:80;
    server_name jsrspaces.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 http://www.jsrspaces.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jsrspaces.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://jsrspaces_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
